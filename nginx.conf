server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Cache long pour les assets versionnés par Vite (noms hachés).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 404 FRANC sur un chunk empreinté disparu — cas d'un onglet resté
        # ouvert après un redéploiement. Jamais un repli vers index.html : le
        # navigateur refuserait de l'exécuter comme module ES, et l'erreur
        # serait incompréhensible.
        try_files $uri =404;
    }

    # Point d'entrée SPA : JAMAIS mis en cache, pour ne pas servir une version
    # périmée après déploiement.
    #
    # ⚠️ Les en-têtes de sécurité sont répétés ici : un bloc `location` qui
    # utilise `add_header` n'hérite PAS de ceux déclarés au niveau `server`.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Repli SPA : toute route rend index.html (routage côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
